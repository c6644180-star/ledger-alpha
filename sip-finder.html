<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ledger Alpha — SIP Finder</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,500&display=swap');:root{--bg:#0b0f14;--p:#12181f;--l:#293540;--g:#c9a227;--teal:#2e8b7f;--m:#8d98a2;--t:#edf0eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px 'DM Sans',sans-serif}.app{max-width:850px;margin:auto;padding:55px 20px}.brand{font:12px 'DM Mono';letter-spacing:2px}.brand b,.eyebrow{color:var(--g)}.eyebrow{font:10px 'DM Mono';letter-spacing:1.5px}h1{font:500 clamp(40px,6vw,68px)/1 Fraunces;margin:12px 0}.lead{color:var(--m);line-height:1.6;max-width:580px}.box{background:var(--p);border:1px solid var(--l);padding:18px;margin-top:25px}.search{display:flex;gap:9px}.search input{width:100%;background:#0d1318;border:1px solid #37434e;color:#fff;padding:12px}.results{margin-top:9px;border:1px solid var(--l);max-height:390px;overflow:auto}.result{padding:12px;border-bottom:1px dashed #2b3741;display:flex;justify-content:space-between;align-items:center;gap:12px}.result b{font-size:13px}.result small{display:block;font:10px 'DM Mono';color:var(--m);margin-top:4px}.result button{background:var(--teal);border:0;color:#fff;padding:8px 10px;font-weight:700;cursor:pointer}.note{font-size:11px;color:var(--m);line-height:1.5}.success{border-left:2px solid var(--teal);padding:10px;color:#a5d9d2;background:#12211f;margin-top:12px}.back{display:inline-block;color:#d5bd53;margin-top:22px;font-size:12px}</style><body><main class="app"><div class="brand">LEDGER <b>ALPHA</b></div><p class="eyebrow">AUTOMATIC SIP / MUTUAL-FUND FINDER</p><h1>Find the exact<br>fund scheme.</h1><p class="lead">Start typing any Indian mutual fund name. This searches the full MFapi scheme catalogue, including Direct/Regular and Growth/IDCW variants. No API key is required.</p><section class="box"><div class="search"><input id="q" autofocus placeholder="Try: Parag Parikh, HDFC Mid Cap, SBI Small Cap…" oninput="search()"></div><div id="out" class="results"></div><div id="msg"></div></section><a class="back" href="portfolio-tracker-pro.html">← Return to Combined Portfolio</a></main><script>
let timer;const q=document.getElementById('q'),out=document.getElementById('out'),msg=document.getElementById('msg');function search(){clearTimeout(timer);out.innerHTML='';let v=q.value.trim();if(v.length<2)return;timer=setTimeout(async()=>{out.innerHTML='<div class="result">Searching every Indian mutual-fund scheme…</div>';try{const r=await fetch('https://api.mfapi.in/mf/search?q='+encodeURIComponent(v)),data=await r.json();out.innerHTML=data.length?data.slice(0,30).map(x=>`<div class="result"><div><b>${x.schemeName}</b><small>AMFI scheme code: ${x.schemeCode}</small></div><button onclick='choose(${x.schemeCode},${JSON.stringify(x.schemeName)})'>Select</button></div>`).join(''):'<div class="result">No matching schemes found.</div>'}catch{out.innerHTML='<div class="result">Search failed. Check your internet connection and retry.</div>'}},300)}async function choose(code,name){let units=prompt('How many units do you own?');if(!units)return;let buy=prompt('What is your average buy NAV (₹)?');if(!buy)return;let nav=+buy,date='latest available NAV';try{const d=await(await fetch('https://api.mfapi.in/mf/'+code+'/latest')).json();if(d.data&&d.data[0]){nav=+d.data[0].nav;date=d.data[0].date}}catch{}let h=JSON.parse(localStorage.getItem('ledger-alpha-pro')||'[]');h.push({id:crypto.randomUUID(),name,symbol:String(code),type:'fund',units:+units,avg_cost:+buy,current_price:nav,buy:+buy,current:nav});localStorage.setItem('ledger-alpha-pro',JSON.stringify(h));out.innerHTML='';msg.innerHTML=`<div class="success"><b>Added:</b> ${name}<br>Latest NAV: ₹${nav} (${date}). Now open the Combined Portfolio.</div>`;q.value=''}
</script></body></html>
