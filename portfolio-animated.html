<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Ledger</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,500&display=swap');:root{--bg:#070b10;--p:#111923;--l:#26323e;--gold:#d7b83e;--teal:#39a99c;--up:#5ce0aa;--dn:#ff7664;--m:#81909c;--t:#eef4f0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 78% 12%,#1a2540 0,transparent 32%),var(--bg);color:var(--t);font:14px 'DM Sans',sans-serif}.app{max-width:1180px;margin:auto;padding:0 20px 65px}.ticker{height:32px;border-bottom:1px solid var(--l);overflow:hidden;white-space:nowrap;font:10px 'DM Mono';color:#a7b3bb}.ticker div{display:inline-block;padding-top:9px;animation:ticker 28s linear infinite}.ticker span{margin-right:34px}.top{height:76px;display:flex;align-items:center}.brand{font:12px 'DM Mono';letter-spacing:2px}.brand b{color:var(--gold)}.pulse{width:7px;height:7px;background:var(--up);border-radius:50%;margin-left:12px;box-shadow:0 0 0 0 #5ce0aa;animation:pulse 2s infinite}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--l);overflow:auto}.tabs button{background:none;border:0;color:var(--m);padding:14px 1px;cursor:pointer;white-space:nowrap;position:relative}.tabs .on{color:var(--t)}.tabs .on:after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--gold)}.hero{padding:40px 0 24px;display:flex;justify-content:space-between;align-items:end}.eyebrow{color:var(--gold);font:10px 'DM Mono';letter-spacing:1.5px}h1{font:500 clamp(52px,8vw,88px)/.93 Fraunces;margin:8px 0;letter-spacing:-2px}.gain{font:12px 'DM Mono'}.up{color:var(--up)}.dn{color:var(--dn)}.btn{border:1px solid #5f5121;background:#1c1c13;color:#ead36d;padding:10px 13px;font-weight:700;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.panel{background:linear-gradient(135deg,#141e28,#0e151d);border:1px solid var(--l)}.card{padding:15px;border-radius:3px}.card span{font:9px 'DM Mono';letter-spacing:1px;color:var(--m)}.card b{display:block;font:500 23px Fraunces;margin-top:9px}.panel{padding:17px;margin-top:14px;border-radius:3px}.panel h2{margin:0;font-size:14px}.hint{color:var(--m);font-size:11px;line-height:1.5}.chart{height:265px}.chart canvas{height:100%;width:100%}.search{display:flex;gap:8px;margin-top:13px}.search input,input{width:100%;background:#080d12;border:1px solid #35424e;color:#fff;padding:11px}.gold,.teal{border:0;padding:10px 12px;font-weight:700;cursor:pointer}.gold{background:var(--gold);color:#15140d}.teal{background:var(--teal);color:#fff}.results{max-height:290px;overflow:auto;border:1px solid var(--l);margin-top:8px}.result{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px;border-bottom:1px dashed #2c3944}.result small,code{display:block;color:var(--m);font:10px 'DM Mono';margin-top:4px}.result button{background:#1d2b35;color:#dce8e6;border:1px solid #3a5058;padding:7px 10px;cursor:pointer}.scroll{overflow:auto}table{width:100%;min-width:760px;border-collapse:collapse}th{text-align:left;padding:11px;color:var(--m);font:9px 'DM Mono';letter-spacing:1px}td{padding:12px 11px;border-top:1px dashed #2b3943;font:12px 'DM Mono'}td b{font-family:'DM Sans'}.sectors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.sector{border:1px solid #2d4148;background:#0d171d;padding:13px}.sector b{font-size:13px}.sector span{display:block;font:10px 'DM Mono';color:var(--teal);margin-top:7px}.news{margin-top:12px}.news a{display:block;color:#dce7e4;text-decoration:none;border-left:2px solid var(--gold);background:#111a21;padding:10px;margin:7px 0}.news small{color:var(--m);display:block;margin-top:4px}.setting{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed #2b3943;padding:13px 0}.setting:last-child{border:0}.modal{display:none;place-items:center;position:fixed;inset:0;background:#020407dd;padding:20px}.modal.show{display:grid}.modal .panel{width:min(450px,100%)}@keyframes ticker{to{transform:translateX(-50%)}}@keyframes pulse{70%{box-shadow:0 0 0 8px #5ce0aa00}100%{box-shadow:0 0 0 0 #5ce0aa00}}@media(max-width:700px){.app{padding:0 14px}.hero{display:block}.hero button{margin-top:18px}.cards{grid-template-columns:1fr 1fr}.sectors{grid-template-columns:1fr 1fr}}
</style><body><main class="app"><div class="ticker"><div id="ticker">ORBIT LEDGER · YOUR PORTFOLIO IS WAITING</div></div><header class="top"><div class="brand">ORBIT <b>LEDGER</b></div><div class="pulse"></div><button class="btn" style="margin-left:auto" onclick="openSettings()">Settings</button></header><nav class="tabs"><button class="on" id="portfolio" onclick="go('portfolio')">Portfolio</button><button id="stocks" onclick="go('stocks')">Stocks</button><button id="funds" onclick="go('funds')">SIP finder</button><button id="news" onclick="go('news')">News & sectors</button><button id="settings" onclick="go('settings')">Settings</button></nav><section class="hero"><div><span class="eyebrow" id="label">YOUR MONEY, IN MOTION</span><h1 id="total">₹0</h1><div class="gain" id="gain"></div></div><button class="btn" onclick="refreshStocks()">↻ Refresh market pulse</button></section><section class="cards"><div class="card"><span>YOU PUT IN</span><b id="invested">₹0</b></div><div class="card"><span>STOCK ORBIT</span><b id="stockval">₹0</b></div><div class="card"><span>FUND ORBIT</span><b id="fundval">₹0</b></div><div class="card"><span>NET MOMENTUM</span><b id="profit">₹0</b></div></section><div id="view"></div></main><div id="modal" class="modal"><div class="panel"><h2>Market data key</h2><p class="hint">Add your Twelve Data key for stock lookup, price refresh, official releases, and usage checks. It stays in this browser.</p><input id="key" type="password" placeholder="Paste API key"><p><button class="gold" onclick="saveKey()">Save locally</button> <button class="btn" onclick="modal.classList.remove('show')">Cancel</button></p></div></div><script>
let page='portfolio',key=localStorage.getItem('ledger-alpha-api-key')||'',h=JSON.parse(localStorage.getItem('orbit-ledger')||localStorage.getItem('ledger-alpha-portfolio')||'[]'),timer;const $=x=>document.getElementById(x),inr=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n||0),buy=x=>x.buy??x.avg_cost??0,now=x=>x.current??x.current_price??buy(x),cost=x=>x.units*buy(x),value=x=>x.units*now(x);function save(){localStorage.setItem('orbit-ledger',JSON.stringify(h))}function go(x){page=x;render()}function openSettings(){$('key').value=key;modal.classList.add('show')}function saveKey(){key=$('key').value.trim();localStorage.setItem('ledger-alpha-api-key',key);modal.classList.remove('show');render()}function render(){let inv=h.reduce((s,x)=>s+cost(x),0),cur=h.reduce((s,x)=>s+value(x),0),p=cur-inv,st=h.filter(x=>x.type==='stock'),fu=h.filter(x=>x.type==='fund');$('total').textContent=inr(cur);$('invested').textContent=inr(inv);$('stockval').textContent=inr(st.reduce((s,x)=>s+value(x),0));$('fundval').textContent=inr(fu.reduce((s,x)=>s+value(x),0));$('profit').textContent=inr(p);$('profit').className=p>=0?'up':'dn';$('gain').innerHTML=`<span class="${p>=0?'up':'dn'}">${p>=0?'▲':'▼'} ${inr(Math.abs(p))}</span> after ${inr(inv)} invested`;['portfolio','stocks','funds','news','settings'].forEach(x=>$(x).classList.toggle('on',x===page));$('ticker').innerHTML=h.length?[...h,...h].map(x=>`<span>${x.symbol} ${inr(now(x))}</span>`).join(' · '):'ORBIT LEDGER · SEARCH A STOCK OR SIP TO BEGIN';$('view').innerHTML=page==='portfolio'?portfolio():page==='stocks'?stocks():page==='funds'?funds():page==='news'?news():settings();if(page==='portfolio')draw()}function portfolio(){return `<section class="panel chart"><h2>Capital orbit</h2><p class="hint">Gold is current value. Dashed slate is what you invested.</p><canvas id="chart"></canvas></section>${table()}`}function stocks(){return `<section class="panel"><h2>Search Indian stocks</h2><p class="hint">Find NSE/BSE holdings by name. Requires the stock API key.</p><div class="search"><input id="q" placeholder="Reliance, TCS, HDFC…" oninput="findStocks()"></div><div id="out" class="results"></div></section>${table()}`}function funds(){return `<section class="panel"><h2>Automatic SIP finder</h2><p class="hint">Search India’s mutual-fund scheme catalogue. Choose the exact plan, then it fetches latest NAV.</p><div class="search"><input id="q" autofocus placeholder="Parag Parikh, SBI Small Cap, HDFC…" oninput="findFunds()"></div><div id="out" class="results"></div></section>${table()}`}function news(){let stocks=h.filter(x=>x.type==='stock');return `<section class="panel"><h2>Your sector map</h2><p class="hint">Sectors are inferred from your ticker. News links search current reporting for each stock; refresh official announcements with your API key.</p><div class="sectors">${stocks.length?stocks.map(x=>`<div class="sector"><b>${x.symbol}</b><span>${sector(x.symbol)}</span></div>`).join(''):'<div class="hint">Add stocks first.</div>'}</div><div class="news">${stocks.map(x=>`<a target="_blank" href="https://news.google.com/search?q=${encodeURIComponent(x.name||x.symbol)}"><b>News for ${x.name||x.symbol} ↗</b><small>Open current financial coverage in Google News</small></a>`).join('')}</div></section>`}function settings(){return `<section class="panel"><h2>Settings & API pulse</h2><div class="setting"><div><b>Stock data key</b><small>${key?'Connected locally':'Not added'}</small></div><button class="gold" onclick="openSettings()">${key?'Change key':'Add key'}</button></div><div class="setting"><div><b>API usage / limit</b><small id="usage">Click check to query Twelve Data usage for this key.</small></div><button class="btn" onclick="usage()">Check limit</button></div><div class="setting"><div><b>SIP NAV source</b><small>MFapi scheme search and latest NAV; no API key.</small></div><span class="up">ACTIVE</span></div></section>`}function table(){return `<section class="panel"><h2>Holdings</h2><div class="scroll"><table><thead><tr><th>INSTRUMENT</th><th>UNITS</th><th>INVESTED</th><th>PRICE / NAV</th><th>VALUE</th><th>RETURN</th></tr></thead><tbody>${h.length?h.map(x=>{let r=(value(x)-cost(x))/cost(x)*100;return `<tr><td><b>${x.name}</b><code>${x.symbol} · ${x.type==='fund'?'LATEST NAV':'NSE/BSE'}</code></td><td>${x.units}</td><td>${inr(cost(x))}</td><td>${inr(now(x))}</td><td>${inr(value(x))}</td><td class="${r>=0?'up':'dn'}">${r.toFixed(2)}%</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">Your portfolio will appear here.</td></tr>'}</tbody></table></div></section>`}function sector(s){return /BANK|HDFCBANK|ICICI|SBIN|AXIS|KOTAK|BAJFIN/.test(s)?'FINANCIALS':/TCS|INFY|WIPRO|HCL/.test(s)?'TECHNOLOGY':/SUN|DR|CIPLA/.test(s)?'HEALTHCARE':/TATA|RELIANCE|LT|ADANI/.test(s)?'INDUSTRIALS':'EQUITY'}function findFunds(){clearTimeout(timer);let q=$('q').value.trim();if(q.length<2)return;timer=setTimeout(async()=>{out.innerHTML='<div class="result">Scanning SIP universe…</div>';try{let a=await(await fetch('https://api.mfapi.in/mf/search?q='+encodeURIComponent(q))).json();out.innerHTML=a.slice(0,20).map(x=>`<div class="result"><div><b>${x.schemeName}</b><small>Scheme ${x.schemeCode}</small></div><button onclick='addFund(${x.schemeCode},${JSON.stringify(x.schemeName)})'>Add</button></div>`).join('')||'<div class="result">No matching fund.</div>'}catch{out.innerHTML='<div class="result">Search failed. Check internet.</div>'}},300)}async function addFund(c,n){let u=prompt('Units owned?'),b=prompt('Average buy NAV (₹)?');if(!u||!b)return;let nav=+b;try{let d=await(await fetch('https://api.mfapi.in/mf/'+c+'/latest')).json();nav=+(d.data?.[0]?.nav||b)}catch{}h.push({name:n,symbol:String(c),type:'fund',units:+u,buy:+b,current:nav});save();go('portfolio')}function findStocks(){clearTimeout(timer);let q=$('q').value.trim();if(q.length<2)return;if(!key){out.innerHTML='<div class="result">Add your stock API key in Settings first.</div>';return}timer=setTimeout(async()=>{try{let d=await(await fetch('https://api.twelvedata.com/symbol_search?symbol='+encodeURIComponent(q)+'&apikey='+encodeURIComponent(key))).json(),a=(d.data||[]).filter(x=>/India|NSE|BSE/i.test([x.country,x.exchange].join(' '))).slice(0,15);out.innerHTML=a.map(x=>`<div class="result"><div><b>${x.instrument_name||x.symbol}</b><small>${x.symbol} · ${x.exchange}</small></div><button onclick="addStock('${(x.instrument_name||x.symbol).replace(/'/g,'')}', '${x.symbol}')">Add</button></div>`).join('')||'<div class="result">No Indian listing returned.</div>'}catch{out.innerHTML='<div class="result">Search failed. Check key.</div>'}},300)}function addStock(n,s){let u=prompt('Shares bought?'),b=prompt('Buy price per share (₹)?');if(!u||!b)return;h.push({name:n,symbol:s,type:'stock',units:+u,buy:+b,current:+b});save();go('portfolio')}async function refreshStocks(){if(!key)return openSettings();let n=0;for(let x of h.filter(x=>x.type==='stock'))try{let d=await(await fetch('https://api.twelvedata.com/price?symbol='+encodeURIComponent(x.symbol)+'&apikey='+encodeURIComponent(key))).json();if(d.price){x.current=+d.price;n++}}catch{}save();render();alert(n?'Market pulse updated for '+n+' stock(s).':'No price update—check coverage or API plan.')}async function usage(){if(!key)return openSettings();usage.innerText='Checking…';try{let d=await(await fetch('https://api.twelvedata.com/api_usage?apikey='+encodeURIComponent(key))).json();usage.innerText=d.message||JSON.stringify(d)}catch{usage.innerText='Usage unavailable. Check your Twelve Data dashboard.'}}function draw(){let c=$('chart'),r=c.getBoundingClientRect(),d=devicePixelRatio,w=r.width,hgt=r.height;c.width=w*d;c.height=hgt*d;let x=c.getContext('2d');x.scale(d,d);let p=h.map((z,i)=>{let a=h.slice(0,i+1);return[a.reduce((s,v)=>s+cost(v),0),a.reduce((s,v)=>s+value(v),0)]}),m=Math.max(...p.flat(),1)*1.1;function line(k,col,dash){x.beginPath();x.strokeStyle=col;x.lineWidth=2;x.setLineDash(dash?[6,5]:[]);p.forEach((z,i)=>{let px=18+i*(w-36)/Math.max(p.length-1,1),py=hgt-18-z[k]/m*(hgt-30);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}line(0,'#7d8b94',true);line(1,'#d7b83e')}render();addEventListener('resize',render)
</script></body></html>
