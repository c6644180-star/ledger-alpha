<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ledger Alpha Portfolio</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,500&display=swap');:root{--bg:#0b0f14;--p:#12181f;--l:#293540;--g:#c9a227;--teal:#2e8b7f;--up:#3fb68c;--dn:#e2604b;--m:#8d98a2;--t:#edf0eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px 'DM Sans',sans-serif}.app{max-width:1100px;margin:auto;padding:0 20px 55px}header{height:78px;display:flex;align-items:center;border-bottom:1px solid var(--l)}.brand{font:12px 'DM Mono';letter-spacing:2px}.brand b,.eyebrow{color:var(--g)}.settings{margin-left:auto;background:none;border:1px solid var(--l);color:#c4cdd1;padding:8px 10px;cursor:pointer}.tabs{display:flex;gap:27px;border-bottom:1px solid var(--l)}.tabs button{border:0;background:none;color:var(--m);padding:14px 1px;cursor:pointer;position:relative}.tabs .on{color:var(--t)}.tabs .on:after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--g)}.tabs b{font:10px 'DM Mono';padding:2px 6px;background:#243039;border-radius:9px}.hero{padding:39px 0 25px}.eyebrow{font:10px 'DM Mono';letter-spacing:1.4px}h1{font:500 clamp(47px,7vw,80px)/1 Fraunces;margin:7px 0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card,.box{background:var(--p);border:1px solid var(--l)}.card{padding:15px}.card span{display:block;color:var(--m);font:9px 'DM Mono';letter-spacing:1px}.card b{display:block;font:500 21px Fraunces;margin-top:9px}.box{padding:16px;margin-top:18px}.box h2{margin:0;font-size:14px}.hint{color:var(--m);font-size:11px;line-height:1.5}.search{display:flex;gap:8px;margin-top:12px}.search input,input{width:100%;background:#0c1217;border:1px solid #37434e;color:var(--t);padding:10px}.gold,.teal{border:0;padding:10px 13px;font-weight:700;cursor:pointer;white-space:nowrap}.gold{background:var(--g);color:#17140c}.teal{background:var(--teal);color:#fff}.results{border:1px solid var(--l);margin-top:8px;max-height:310px;overflow:auto}.result{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px;border-bottom:1px dashed #2c3640}.result small,code{display:block;color:var(--m);font:10px 'DM Mono';margin-top:4px}.result button{background:#1d2831;color:#dbe3e4;border:1px solid #3a4752;padding:7px 10px;cursor:pointer}.scroll{overflow:auto}table{width:100%;min-width:760px;border-collapse:collapse}th{text-align:left;padding:11px;color:var(--m);font:9px 'DM Mono';letter-spacing:1px}td{padding:12px 11px;border-top:1px dashed #2c3640;font:12px 'DM Mono'}td b{font-family:'DM Sans'}.up{color:var(--up)}.dn{color:var(--dn)}.empty{text-align:center;color:var(--m);padding:25px}.chart{height:260px}.chart canvas{width:100%;height:100%}.modal{display:none;place-items:center;position:fixed;inset:0;background:#020406dc;padding:20px}.modal.show{display:grid}.modal .box{width:min(450px,100%)}.modal label{display:block;font-size:11px;color:#c1c9cf;margin-top:12px}@media(max-width:700px){.app{padding:0 14px}.cards{grid-template-columns:1fr 1fr}.tabs{gap:15px}}</style><body><main class="app"><header><div class="brand">LEDGER <b>ALPHA</b></div><button class="settings" onclick="settings()">Stock API key</button></header><nav class="tabs"><button id="stock" onclick="setTab('stock')">Stocks <b id="sc">0</b></button><button id="fund" onclick="setTab('fund')">SIP / Mutual Funds <b id="fc">0</b></button><button class="on" id="all" onclick="setTab('all')">Combined <b id="ac">0</b></button></nav><section class="hero"><span class="eyebrow" id="label">COMBINED PORTFOLIO VALUE</span><h1 id="total">₹0</h1><div id="gain"></div></section><section class="cards"><div class="card"><span>INVESTED</span><b id="invested">₹0</b></div><div class="card"><span>STOCK VALUE</span><b id="sv">₹0</b></div><div class="card"><span>FUND VALUE</span><b id="fv">₹0</b></div><div class="card"><span>PROFIT / LOSS</span><b id="pl">₹0</b></div></section><div id="view"></div></main><div id="modal" class="modal"><div class="box"><h2>Connect stock search</h2><p class="hint">Add your Twelve Data key for NSE/BSE stock search and price refresh. Mutual-fund search works automatically without a key.</p><label>API key<input id="key" type="password"></label><p><button class="gold" onclick="saveKey()">Save</button> <button onclick="modal.classList.remove('show')">Cancel</button></p></div></div><script>
let tab='all',key=localStorage.getItem('ledger-alpha-api-key')||'',holdings=JSON.parse(localStorage.getItem('ledger-alpha-portfolio')||localStorage.getItem('ledger-alpha-pro')||'[]'),timer;const $=x=>document.getElementById(x),inr=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n||0),buy=h=>h.buy??h.avg_cost??0,now=h=>h.current??h.current_price??buy(h),cost=h=>h.units*buy(h),value=h=>h.units*now(h),list=()=>tab==='all'?holdings:holdings.filter(h=>h.type===tab);function save(){localStorage.setItem('ledger-alpha-portfolio',JSON.stringify(holdings))}function setTab(x){tab=x;render()}function settings(){$('key').value=key;$('modal').classList.add('show')}function saveKey(){key=$('key').value.trim();localStorage.setItem('ledger-alpha-api-key',key);modal.classList.remove('show');render()}function add(h){holdings.push(h);save();render()}function render(){let a=list(),inv=a.reduce((s,h)=>s+cost(h),0),cur=a.reduce((s,h)=>s+value(h),0),p=cur-inv,stocks=holdings.filter(h=>h.type==='stock'),funds=holdings.filter(h=>h.type==='fund');$('sc').textContent=stocks.length;$('fc').textContent=funds.length;$('ac').textContent=holdings.length;['stock','fund','all'].forEach(x=>$(x).classList.remove('on'));$(tab).classList.add('on');$('label').textContent=tab==='stock'?'STOCK PORTFOLIO VALUE':tab==='fund'?'SIP / MUTUAL-FUND VALUE':'COMBINED PORTFOLIO VALUE';$('total').textContent=inr(cur);$('invested').textContent=inr(inv);$('sv').textContent=inr(stocks.reduce((s,h)=>s+value(h),0));$('fv').textContent=inr(funds.reduce((s,h)=>s+value(h),0));$('pl').textContent=inr(p);$('pl').className=p>=0?'up':'dn';$('gain').innerHTML=`<span class="${p>=0?'up':'dn'}">${p>=0?'▲':'▼'} ${inr(Math.abs(p))}</span> on ${inr(inv)} invested`;$('view').innerHTML=tab==='stock'?stockUI():tab==='fund'?fundUI():allUI();if(tab==='all')chart(a)}function stockUI(){return `<section class="box"><h2>Find an Indian stock</h2><p class="hint">Type a company name to search NSE/BSE. Uses your Twelve Data API key.</p><div class="search"><input id="q" placeholder="Reliance, TCS, HDFC…" oninput="findStocks()"><button class="gold" onclick="refreshStocks()">Refresh prices</button></div><div class="results" id="results"></div></section>${table()}`}function fundUI(){return `<section class="box"><h2>Find any Indian mutual fund or SIP</h2><p class="hint">Type a fund name. This automatically searches the full MFapi scheme catalogue—no key required. Select the exact Direct/Regular and Growth/IDCW plan.</p><div class="search"><input id="q" autofocus placeholder="Parag Parikh, SBI Small Cap, HDFC…" oninput="findFunds()"></div><div class="results" id="results"></div></section>${table()}`}function allUI(){return `<section class="box chart"><h2>Invested vs current value</h2><p class="hint">Gold = current value · dashed slate = invested capital.</p><canvas id="chart"></canvas></section>${table()}`}function table(){let a=list();return `<section class="box"><h2>${tab==='all'?'All investments':tab==='stock'?'Your stocks':'Your SIPs & funds'}</h2><div class="scroll"><table><thead><tr><th>INSTRUMENT</th><th>UNITS</th><th>INVESTED</th><th>CURRENT PRICE / NAV</th><th>VALUE</th><th>RETURN</th></tr></thead><tbody>${a.length?a.map(h=>{let r=(value(h)-cost(h))/cost(h)*100;return `<tr><td><b>${h.name}</b><code>${h.symbol} · ${h.type==='fund'?'LATEST NAV':'NSE/BSE'}</code></td><td>${h.units}</td><td>${inr(cost(h))}</td><td>${inr(now(h))}</td><td>${inr(value(h))}</td><td class="${r>=0?'up':'dn'}">${r.toFixed(2)}%</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">Nothing added here yet.</td></tr>'}</tbody></table></div></section>`}function findFunds(){clearTimeout(timer);let q=$('q').value.trim(),out=$('results');out.innerHTML='';if(q.length<2)return;timer=setTimeout(async()=>{out.innerHTML='<div class="result">Searching mutual-fund schemes…</div>';try{let d=await(await fetch('https://api.mfapi.in/mf/search?q='+encodeURIComponent(q))).json();out.innerHTML=d.length?d.slice(0,25).map(x=>`<div class="result"><div><b>${x.schemeName}</b><small>AMFI scheme code: ${x.schemeCode}</small></div><button onclick='selectFund(${x.schemeCode},${JSON.stringify(x.schemeName)})'>Select</button></div>`).join(''):'<div class="result">No matching schemes found.</div>'}catch{out.innerHTML='<div class="result">SIP search failed. Check internet and retry.</div>'}},300)}async function selectFund(code,name){let units=prompt('How many units do you own?');if(!units)return;let avg=prompt('What is your average purchase NAV (₹)?');if(!avg)return;let nav=+avg;try{let d=await(await fetch('https://api.mfapi.in/mf/'+code+'/latest')).json();if(d.data&&d.data[0])nav=+d.data[0].nav}catch{}add({name,symbol:String(code),type:'fund',units:+units,buy:+avg,current:nav})}function findStocks(){clearTimeout(timer);let q=$('q').value.trim(),out=$('results');out.innerHTML='';if(q.length<2)return;if(!key){out.innerHTML='<div class="result">Add your stock API key first.</div>';return}timer=setTimeout(async()=>{try{let d=await(await fetch('https://api.twelvedata.com/symbol_search?symbol='+encodeURIComponent(q)+'&outputsize=25&apikey='+encodeURIComponent(key))).json(),a=(d.data||[]).filter(x=>/India|NSE|BSE/i.test([x.country,x.exchange,x.mic_code].join(' '))).slice(0,15);out.innerHTML=a.length?a.map(x=>`<div class="result"><div><b>${x.instrument_name||x.symbol}</b><small>${x.symbol} · ${x.exchange||'India'}</small></div><button onclick="selectStock('${(x.instrument_name||x.symbol).replace(/'/g,'')}', '${x.symbol}')">Select</button></div>`).join(''):'<div class="result">No Indian exchange match returned.</div>'}catch{out.innerHTML='<div class="result">Stock search failed. Check your key.</div>'}},300)}function selectStock(name,symbol){let units=prompt('How many shares did you buy?');if(!units)return;let avg=prompt('What was your buy price per share (₹)?');if(!avg)return;add({name,symbol,type:'stock',units:+units,buy:+avg,current:+avg})}async function refreshStocks(){if(!key)return alert('Add your stock API key first.');let n=0;for(let h of holdings.filter(x=>x.type==='stock'))try{let d=await(await fetch('https://api.twelvedata.com/price?symbol='+encodeURIComponent(h.symbol)+'&apikey='+encodeURIComponent(key))).json();if(d.price){h.current=+d.price;n++}}catch{}save();render();alert(n?'Updated '+n+' stock price(s).':'No prices updated. Check coverage and plan.')}function chart(a){let c=$('chart'),r=c.getBoundingClientRect(),d=devicePixelRatio,w=r.width,h=r.height;c.width=w*d;c.height=h*d;let x=c.getContext('2d');x.scale(d,d);let p=a.map((z,i)=>{let t=a.slice(0,i+1);return[t.reduce((s,v)=>s+cost(v),0),t.reduce((s,v)=>s+value(v),0)]}),m=Math.max(...p.flat(),1)*1.1;function line(k,col,dash){x.beginPath();x.strokeStyle=col;x.lineWidth=2;x.setLineDash(dash?[6,5]:[]);p.forEach((z,i)=>{let px=18+i*(w-36)/Math.max(p.length-1,1),py=h-18-z[k]/m*(h-30);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}line(0,'#78858f',true);line(1,'#c9a227')}render();addEventListener('resize',render)
</script></body></html>
