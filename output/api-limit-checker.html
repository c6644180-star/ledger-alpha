<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Ledger — API Limit</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;600&family=Fraunces:opsz,wght@9..144,500&display=swap');body{margin:0;background:#080d12;color:#edf2ee;font:14px 'DM Sans',sans-serif}.card{width:min(620px,calc(100% - 40px));margin:12vh auto;background:#121b24;border:1px solid #2c3a45;padding:28px}.brand{font:11px 'DM Mono';letter-spacing:2px;color:#d7b83e}.eyebrow{font:10px 'DM Mono';letter-spacing:1.4px;color:#d7b83e;margin-top:36px}h1{font:500 42px/1 Fraunces;margin:8px 0 14px}.hint{color:#94a0a9;line-height:1.55;font-size:12px}input{width:100%;box-sizing:border-box;background:#090f14;border:1px solid #354450;color:#fff;padding:11px;margin:9px 0}button{border:0;background:#d7b83e;color:#17150d;padding:11px 14px;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#090f14;border:1px solid #2c3943;padding:14px;color:#a8d7cd;min-height:70px;font:11px 'DM Mono';margin-top:18px}.back{display:inline-block;color:#d7b83e;margin-top:18px;font-size:12px}</style><body><main class="card"><div class="brand">ORBIT LEDGER</div><div class="eyebrow">TWELVE DATA</div><h1>API limit checker</h1><p class="hint">Your saved key is loaded automatically. The key is not displayed. If no key is stored, paste it below and it will remain only in this browser.</p><input id="key" type="password" placeholder="Market-data API key"><button onclick="checkLimit()">Check my API usage</button><pre id="result">Ready to check.</pre><a class="back" href="portfolio-animated.html">← Return to animated portfolio</a></main><script>const keyField=document.getElementById('key'),result=document.getElementById('result');keyField.value=localStorage.getItem('ledger-alpha-api-key')||'';async function checkLimit(){const key=keyField.value.trim();if(!key){result.textContent='Paste your API key first.';return}localStorage.setItem('ledger-alpha-api-key',key);result.textContent='Checking Twelve Data…';try{const response=await fetch('https://api.twelvedata.com/api_usage?apikey='+encodeURIComponent(key));const data=await response.json();if(!response.ok||data.status==='error'||data.code){result.textContent='Provider response:\n'+(data.message||JSON.stringify(data,null,2));return}result.textContent='Usage response:\n'+JSON.stringify(data,null,2)+'\n\nTip: API credit limits depend on your Twelve Data plan and may reset each minute.'}catch(error){result.textContent='Could not contact the API. Check your internet connection, key, and browser permissions.\n\n'+error.message}}</script></body></html>
